services: 
    banco-dados:
      image: postgres:17
      container_name: meu_postgres_next
      restart: always
      environment: 
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - "5432:5432"
      volumes:
        - dados:/var/lib/postgresql/data
volumes:
  dados: